<style>
:root{
  --bg:#14100D; --surface:#211915; --surface2:#2C221C; --line:#3B2E26;
  --cream:#F2E7D8; --text2:#D8C9B6; --muted:#B9A693; --gold:#D4A15F; --gold2:#E8BE85; --rose:#C8705A;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--cream);font-family:'Prompt',sans-serif;font-weight:400;-webkit-font-smoothing:antialiased}
a{color:var(--gold);text-decoration:none}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.en{font-style:italic;color:var(--muted)}

/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(20,16,13,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:24px;height:68px}
.logo img{height:40px;display:block}
.topnav{display:flex;gap:24px;flex-grow:1}
.topnav a{color:var(--text2);font-size:16px;padding:8px 0}
.topnav a.on{color:var(--gold)}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--cream);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}

/* bottom nav (mobile) */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;justify-content:space-around;padding:8px 6px calc(10px + env(safe-area-inset-bottom));background:#19130F;border-top:1px solid var(--line)}
.bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);min-width:64px;padding:4px}
.bottom a.on{color:var(--gold)}
@media (max-width:860px){
  .topnav{display:none}
  .bottom{display:flex}
  body{padding-bottom:84px}
  .top .wrap{height:60px}
  .logo img{height:34px}
}

/* common */
.eyebrow{font-size:13px;letter-spacing:3px;color:var(--gold);text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{height:44px;padding:0 18px;border-radius:999px;border:1px solid #4A3A2F;background:transparent;color:var(--cream);font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:var(--bg);font-weight:500}
.btn{height:52px;padding:0 26px;border-radius:16px;border:none;background:var(--gold);color:var(--bg);font-size:16px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn:hover{background:var(--gold2)}
.btn.ghost{background:transparent;border:1px solid #4A3A2F;color:var(--cream)}
h1,h2,h3{margin:0;font-weight:600}
section{margin:0}

/* home */
.hero{background:radial-gradient(circle at 80% 10%,#6B4325 0%,#2A1D16 40%,var(--bg) 78%)}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center;padding-top:56px;padding-bottom:56px}
.hero h1{font-size:clamp(34px,5vw,56px);line-height:1.15;margin:12px 0 16px}
.hero p{color:var(--text2);font-size:18px;line-height:1.7;margin:0 0 26px;max-width:520px;font-weight:300}
.feature{display:flex;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:22px;color:var(--cream)}
.feature:hover{border-color:#5A4636}
.feature .art{width:130px;flex-shrink:0}
.feature h3{font-size:26px;line-height:1.2}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr;padding-top:28px;padding-bottom:28px}}

.block{padding:36px 0}
.blockhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:18px}
.blockhead h2{font-size:24px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.stat{background:var(--surface);border-radius:20px;padding:20px;color:var(--cream);border:1px solid transparent}
.stat:hover{border-color:var(--line)}
.stat b{display:block;font-size:40px;font-weight:600;color:var(--gold);line-height:1}
.stat span{font-size:16px}
.equip{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.eqcard{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;color:var(--cream);cursor:pointer;text-align:left;font-size:15px;min-height:64px}
.eqcard[aria-pressed=true]{border-color:var(--gold);background:#2E2219}
.eqcard small{display:block;color:var(--muted);font-size:13px}

/* recipe grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{display:flex;gap:16px;background:var(--surface);border:1px solid #2F241D;border-radius:22px;padding:16px;color:var(--cream);min-height:150px;transition:border-color .15s,transform .15s}
.card:hover{border-color:#5A4636;transform:translateY(-2px)}
.card .thumb{width:80px;flex-shrink:0;border-radius:16px;background:var(--surface2);display:flex;align-items:center;justify-content:center}
.card .meta{display:flex;flex-direction:column;gap:3px;min-width:0}
.card .no{font-size:12px;color:var(--gold)}
.card .th{font-size:19px;font-weight:600;line-height:1.3}
.card .spec{font-size:14px;line-height:1.5;color:var(--text2);margin-top:4px;font-weight:300}
.card .foot{font-size:13px;color:var(--muted);margin-top:auto;padding-top:6px}
.empty{padding:40px;text-align:center;color:var(--muted);background:var(--surface);border-radius:20px}

.pagehead{padding:48px 0 24px;background:radial-gradient(circle at 85% 0%,#5A3720 0%,var(--bg) 60%)}
.pagehead h1{font-size:clamp(30px,4.5vw,46px);margin:10px 0 10px}
.pagehead p{color:var(--text2);margin:0 0 22px;font-size:17px;font-weight:300;max-width:640px;line-height:1.7}
.search{display:flex;align-items:center;gap:10px;height:50px;padding:0 18px;border-radius:999px;background:var(--surface);border:1px solid var(--line);max-width:460px;margin-bottom:16px}
.search input{flex-grow:1;background:transparent;border:none;color:var(--cream);font:inherit;font-size:16px;outline:none;min-width:0}
.search input::placeholder{color:var(--muted)}
.filters{display:flex;flex-direction:column;gap:12px}
.filterlabel{font-size:13px;color:var(--muted)}
select.eqsel{height:44px;border-radius:999px;border:1px solid #4A3A2F;background:var(--surface);color:var(--cream);font:inherit;font-size:15px;padding:0 16px}

/* detail */
.dhero{background:radial-gradient(circle at 70% 30%,#7A4A26 0%,#3A2518 40%,var(--bg) 85%)}
.dhero .wrap{display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:center;padding-top:28px;padding-bottom:40px}
.dhero .art{width:240px}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--text2);font-size:15px;height:44px}
.dhero h1{font-size:clamp(32px,5vw,50px);line-height:1.2;margin:8px 0 2px}
.dhero .en{font-size:20px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.tag{padding:6px 14px;border-radius:999px;background:rgba(33,25,21,.85);font-size:14px}
.dbody{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;padding:32px 0 56px}
@media (max-width:860px){
  .dhero .wrap{grid-template-columns:1fr;justify-items:center;text-align:center;gap:10px}
  .dhero .art{width:180px}
  .tags{justify-content:center}
  .dbody{grid-template-columns:1fr;gap:28px}
}
.panel h2{font-size:22px;margin-bottom:14px}
.inghead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.stepper{display:flex;align-items:center;gap:4px;background:var(--surface);border-radius:999px;padding:4px}
.stepper button{width:44px;height:44px;border-radius:50%;border:none;background:var(--surface2);color:var(--cream);font-size:22px;cursor:pointer}
.stepper button.plus{background:var(--gold);color:var(--bg)}
.stepper span{min-width:72px;text-align:center;font-size:15px}
.ing{list-style:none;margin:0 0 30px;padding:0}
.ing li{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--surface2);font-size:16px}
.ing li b{color:var(--gold);font-weight:500;white-space:nowrap}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px;counter-reset:s}
.steps li{display:flex;gap:14px;font-size:16px;line-height:1.65;font-weight:300}
.steps li::before{counter-increment:s;content:counter(s);flex-shrink:0;width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:400}
.tip{margin:22px 0 0;padding:16px 18px;border-radius:16px;background:var(--surface);font-size:15px;line-height:1.65;color:var(--text2);font-weight:300}
.tip b{color:var(--gold);font-weight:500}
.timer{margin-top:22px;display:flex;flex-direction:column;gap:12px}
.timer .clock{font-size:46px;font-weight:600;color:var(--gold);text-align:center;font-variant-numeric:tabular-nums;display:none}
.timer.run .clock{display:block}
.prod{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;color:var(--cream);margin-bottom:12px}
.prod:hover{border-color:#5A4636}
.prod .ico{width:60px;height:60px;border-radius:14px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.prod small{display:block;font-size:13px;color:var(--muted)}
.prod b{display:block;font-size:16px;font-weight:500}
.prod .price{font-size:15px;color:var(--gold)}
.sticky{position:sticky;top:90px}
.fav{color:var(--rose)}
.fav[aria-pressed=true] svg{fill:currentColor}

.foot{border-top:1px solid var(--line);padding:28px 0 36px;color:var(--muted);font-size:14px}
.foot .wrap{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center}
.foot img{height:30px;opacity:.9}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* --- HERO VISUAL · v5 aesthetic and responsive photo system --- */
:root {--bg:#0D1D15;--surface:#19291E;--surface2:#243A29;--line:#35503B;--cream:#FFF8E7;--text2:#DFE1CE;--muted:#B5BDA6;--gold:#DAB873;--gold2:#F0D592;--rose:#E99E85}
body {letter-spacing:0;overflow-x:hidden;background:#0D1D15}
.brandname {display:inline-flex;align-items:center;gap:9px;color:var(--cream);font-weight:600;font-size:17px;white-space:nowrap;letter-spacing:.04em}
.brandname b {font-weight:700;color:var(--gold)}
.brandcup {width:38px;height:38px;border-radius:50%;background:#25422D;display:grid;place-items:center}
.brandcup img {width:38px;height:38px;object-fit:contain}
.footer-brand {font-size:12px;font-weight:600;letter-spacing:.16em;color:var(--gold)}
.top {background:rgba(11,27,18,.93);border-bottom-color:#2D4230}
.hero {min-height:450px;position:relative;isolation:isolate;background:linear-gradient(90deg,#0D2019 0%,#13241D 38%,transparent 90%), url('assets/drinks/hero-iced-latte.webp') right center / auto 110% no-repeat, #0C2019}
.hero::after {content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(8,24,17,.88),rgba(8,24,17,.45) 53%,rgba(8,24,17,.05) 100%)}
.hero .wrap {min-height:450px;grid-template-columns:1.05fr .95fr;padding-top:50px;padding-bottom:50px;align-items:end}
.hero h1 {font-size:clamp(38px,5.4vw,66px);line-height:1.18;letter-spacing:-.025em;text-shadow:0 4px 40px #06190db0}
.hero h1 em{font-style:normal;color:#E6C37F}
.hero p {font-weight:400;max-width:580px;text-shadow:0 2px 20px #06190d}
.feature {align-self:end;margin-left:auto;max-width:430px;width:100%;background:rgba(19,40,27,.86);border:1px solid #67825977;backdrop-filter:blur(14px);box-shadow:0 20px 50px #07150a7a;border-radius:24px;padding:12px 18px 12px 12px}
.feature .art {width:126px;height:138px;overflow:hidden;flex-shrink:0;border-radius:18px;background:#1b3323}
.featurephoto {width:100%;height:100%;object-fit:cover;display:block}
.feature h3{font-size:clamp(20px,2.2vw,27px)}
.stats{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{background:linear-gradient(145deg,#1B3222,#152A1D);border:1px solid #314735}
.stat b{font-size:38px}
.equip{grid-template-columns:repeat(3,minmax(0,1fr))}
.eqcard{background:#1B3121;border-color:#34523B;min-width:0;gap:10px;min-height:82px}
.symbol{width:52px;height:52px;object-fit:contain;flex-shrink:0}
.navsymbol{width:24px;height:24px;object-fit:contain;display:inline-block}
.tabicon{width:22px;height:22px;object-fit:contain;display:inline-block}
.fav[aria-pressed=true] img{filter:drop-shadow(0 0 4px #D9686E)}
.grid{grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:19px}
.card{display:flex;flex-direction:column;gap:0;padding:0;overflow:hidden;min-width:0;min-height:0;border-radius:20px;background:linear-gradient(155deg,#1E3525,#14261A);border-color:#314B36;box-shadow:0 9px 25px #030b0670}
.card:hover{transform:translateY(-4px);border-color:#8FA472}
.card .thumb{width:100%;height:auto;aspect-ratio:1.42;border-radius:0;background:#213b2b;overflow:hidden}
.drinkphoto{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
.card:hover .drinkphoto{transform:scale(1.04)}
.card .meta{padding:14px 16px 17px;gap:2px;flex-grow:1}
.card .no{color:#F2C779;font-size:12px;letter-spacing:.02em}
.card .th{font-size:21px;line-height:1.35}
.card .en{font-size:13px;line-height:1.2;margin-top:2px}
.card .spec{font-size:13px;line-height:1.55;margin-top:9px;min-height:39px}
.card .foot{font-size:12px;margin-top:auto;padding-top:12px}
.pagehead{background:radial-gradient(circle at 80% 0%,#335A31 0%,var(--bg) 64%);padding:34px 0 22px}
.dhero{background:linear-gradient(120deg,#183823,#0B1C15 75%)}
.dhero .wrap{grid-template-columns:minmax(240px,390px) 1fr;gap:50px;padding-top:34px;padding-bottom:34px}
.dhero .art{width:100%;height:min(48vw,420px);max-height:420px;border-radius:28px;overflow:hidden;box-shadow:0 15px 50px #050d0677}
.detailphoto{display:block;width:100%;height:100%;object-fit:cover}
.dhero h1{line-height:1.22}
.tag{background:#29422F;border:1px solid #4C6C48}
.btn,.chip{transition:background .2s,transform .2s}
.btn:hover{transform:translateY(-1px)}
.prod {background:#1C3324;border-color:#3A523B}
.prod .ico{background:#26452E}
.prod .symbol{width:54px;height:54px}
.bottom {background:rgba(11,28,18,.96);border-color:#3B523C;backdrop-filter:blur(15px)}
.foot{background:#0A1A11;border-color:#2C442F}
@media(max-width:860px){
  .hero{background-position:58% center;background-size:auto 100%;}
  .hero .wrap{min-height:590px;display:flex;flex-direction:column;align-items:stretch;justify-content:space-between;padding-top:30px;padding-bottom:24px;gap:32px}
  .hero::after{background:linear-gradient(180deg,rgba(7,22,14,.85) 0%,rgba(7,22,14,.6) 30%,rgba(7,22,14,.32) 59%,rgba(7,22,14,.89) 100%)}
  .hero h1{font-size:clamp(33px,8vw,50px)}
  .hero p{font-size:15px;max-width:430px;margin-bottom:18px}
  .feature{max-width:100%;min-height:126px}
  .feature .art{width:108px;height:114px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .equip{grid-template-columns:1fr}
  .dhero .wrap{grid-template-columns:1fr;text-align:left;justify-items:stretch;gap:20px}
  .dhero .art{width:100%;height:auto;aspect-ratio:1.42;max-height:none}
  .tags{justify-content:flex-start}

  .card .th{font-size:17px}

}
@media(max-width:430px){
 .wrap{padding-left:14px;padding-right:14px}
 .brandname{font-size:14px}
 .hero h1{font-size:34px}
 .hero .wrap{min-height:590px}
 .hero .chips{gap:8px}
 .hero .btn{min-height:46px;height:auto;padding:12px 14px;font-size:14px}
 .feature h3{font-size:19px}
 .stat {padding:16px}
 .stat b {font-size:30px}
 .block{padding:24px 0}

}

/* Official brand artwork supplied by the owner; preserve its original lettering/proportions. */
.brandname.official-logo { display:inline-flex;align-items:center; flex:0 0 auto; max-width:min(44vw,265px); min-width:0; line-height:1; }
.brandname.official-logo img { display:block; width:100%; height:auto; max-height:51px; object-fit:contain; object-position:left center; }
.top .wrap {gap:clamp(11px,2.2vw,24px)}
@media(max-width:860px) { .brandname.official-logo {max-width:min(64vw,230px)} .brandname.official-logo img {max-height:45px} }
@media(max-width:430px) { .brandname.official-logo {max-width:min(63vw,208px)} .brandname.official-logo img {max-height:41px} }


/* V8: Full-glass visuals on every device (no object-fit cover clipping) */
.card .thumb { background:#11291d; }
.card .drinkphoto { object-fit:contain !important; object-position:center center !important; }
.card:hover .drinkphoto {transform:none;}
.dhero .art {background:#11291d;}
.detailphoto {object-fit:contain !important;object-position:center center !important;}
.featurephoto {object-fit:contain !important;object-position:center center !important;}
.sticker-stat {display:block;width:48px;height:48px;object-fit:contain;margin:0 0 5px;filter:drop-shadow(0 4px 5px #02080360)}
.chibi-tab {width:27px;height:27px;object-fit:contain;vertical-align:middle;flex:none}
@media(max-width:860px) {.sticker-stat{width:37px;height:37px}}


/* V11 recipe imagery: whole glass is visible; portrait photography is never cropped. */
.card .thumb {aspect-ratio:4/5 !important;height:auto !important;overflow:hidden;position:relative;background:#1b3022;}
.card .thumb::before{content:"";position:absolute;inset:-12px;background-image:var(--recipe-photo);background-size:cover;background-position:center;filter:blur(14px) brightness(.48);opacity:.8;}
.card .thumb .drinkphoto{position:relative;z-index:1;width:100%;height:100%;box-sizing:border-box;object-fit:contain !important;object-position:center center !important;padding:8px;transform:none !important;}
.dhero .art {aspect-ratio:4/5 !important;height:auto !important;max-height:570px;display:flex;align-items:center;justify-content:center;}
.detailphoto {object-fit:contain !important;}
.featurephoto {object-fit:contain !important;}
@media(max-width:600px){.card .thumb{aspect-ratio:3/4 !important}.card .thumb .drinkphoto{padding:5px}.dhero .art{aspect-ratio:4/5 !important}}

/* V12: wide-screen hero — keep drink photo attached to the content area and fade its left edge */
@media (min-width:861px){
  .hero{background:#0C2019 !important;overflow:hidden}
  .hero::before{content:"";position:absolute;z-index:-2;top:0;bottom:0;right:max(0px,calc(50% - 660px));width:520px;
    background:url('assets/drinks/hero-iced-latte.webp?v=12') right center / auto 100% no-repeat;
    -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 40%,#000 88%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0%,#000 40%,#000 88%,transparent 100%)}
}
@media (min-width:861px) and (max-width:1320px){
  .hero::before{right:0;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 40%);mask-image:linear-gradient(90deg,transparent 0%,#000 40%)}
  .hero::after{background:linear-gradient(90deg,rgba(8,24,17,.92) 0%,rgba(8,24,17,.55) 45%,rgba(8,24,17,.08) 100%)}
}
</style>

<body>

<header class="top">

  <section class="block"><div class="wrap">
    <div class="stats">
      <a class="stat" href="#/recipes?cat=coffee"><img class="sticker-stat" src="assets/stickers/latte-character.png" alt=""/><b>${R.filter(r => r.cat === 'coffee').length}</b><span>สูตรกาแฟ</span></a>
      <a class="stat" href="#/recipes?cat=tea"><img class="sticker-stat" src="assets/stickers/hot-tea.png" alt=""/><b>${R.filter(r => r.cat === 'tea').length}</b><span>สูตรชา</span></a>
      <a class="stat" href="#/recipes?cat=blend"><img class="sticker-stat" src="assets/stickers/berry-smoothie.png" alt=""/><b>${R.filter(r => r.cat === 'blend').length}</b><span>ปั่น / สมูทตี้</span></a>
      <a class="stat" href="#/recipes?cat=soda"><img class="sticker-stat" src="assets/stickers/strawberry-character.png" alt=""/><b>${R.filter(r => r.cat === 'soda').length}</b><span>โซดา / สดชื่น</span></a>
    </div>
  </div></section>

  <section class="block" style="padding-top:8px"><div class="wrap">
    <div class="blockhead"><h2>ที่บ้านมีเครื่องอะไรบ้าง?</h2><span style="color:var(--muted);font-size:14px">เลือกแล้วเราจะคัดสูตรที่ทำได้ให้</span></div>
    <div class="equip">${eqs.map(([k, l, ic]) => `<button type="button" class="eqcard" data-eq="${k}" aria-pressed="${myEq.includes(k)}"><img class="symbol" src="assets/icons/${ic === 'drip' ? 'coffee' : ic}.png" alt="" /><span>${l}<small>${R.filter(r => r.eq === k || (r.eq === 'EB' && (k === 'E' || k === 'B'))).length} สูตรที่ใช้</small></span></button>`).join('')}</div>
    <p id="eqnote" style="color:var(--text2);margin:14px 0 0;font-weight:300"></p>
  </div></section>

  <section class="block"><div class="wrap">
    <div class="blockhead"><h2>ยอดนิยมสัปดาห์นี้</h2><a href="#/recipes">ดูทั้งหมด</a></div>
    <div class="grid">${pop.map(card).join('')}</div>
  </div></section>`;
}

function recipes(q) {
  const cat = q.get('cat') || 'all';
  const fav = q.get('fav') === '1';
  const tabs = [['all','ทั้งหมด'],['coffee','กาแฟ'],['tea','ชา'],['blend','ปั่น / สมูทตี้'],['soda','โซดา']];
  return `
  <section class="pagehead"><div class="wrap">
    <span class="eyebrow">${fav ? 'Favourites' : 'Recipe Book'}</span>
    <h1>${fav ? 'สูตรโปรดของคุณ' : R.length + ' สูตรที่ชงได้จริงที่บ้าน'}</h1>
    <p>${fav ? 'กดรูปหัวใจในหน้าสูตรเพื่อเก็บไว้ที่นี่' : 'กาแฟ ชา โซดา และเมนูปั่น พร้อมสัดส่วนและขั้นตอนที่ทำตามได้ กดเข้าแต่ละสูตรเพื่อดูวิธีทำและอุปกรณ์จากร้าน'}</p>
    <label class="search"><img class="navsymbol" src="assets/icons/search.png" alt="" /><span class="sr">ค้นหาสูตร</span><input id="q" type="search" placeholder="ค้นหา เช่น ลาเต้, มัทฉะ, mango" autocomplete="off"></label>
    <div class="filters">
      <div class="chips" role="group" aria-label="หมวด">${tabs.map(([k, l]) => `<button type="button" class="chip" data-cat="${k}" aria-pressed="${cat === k}"><img class="chibi-tab" src="assets/${k === 'coffee' ? 'stickers/latte-character.png' : k === 'tea' ? 'stickers/hot-tea.png' : k === 'blend' ? 'stickers/berry-smoothie.png' : k === 'soda' ? 'stickers/strawberry-character.png' : 'icons/grid.png'}" alt="" />${l} · <span data-count="${k}"></span></button>`).join('')}</div>
      <div class="chips" style="align-items:center">
        <label class="filterlabel" for="eqsel">ใช้เครื่อง</label>
        <select id="eqsel" class="eqsel"><option value="">ทุกแบบ</option>${Object.entries(EQUIP).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join('')}</select>
      </div>
    </div>
  </div></section>
  <section class="block" style="padding-top:12px"><div class="wrap"><div id="list" class="grid" aria-live="polite"></div></div></section>`;
}

function detail(id) {
  const r = R.find(x => x.id === id);
  if (!r) return `<section class="block"><div class="wrap"><div class="empty">ไม่พบสูตรนี้ <a href="#/recipes">กลับไปดูสูตรทั้งหมด</a></div></div></section>`;
  const prev = R[(id - 2 + R.length) % R.length], next = R[id % R.length];
  return `
  <section class="dhero"><div class="wrap">
    <div class="art"><img class="detailphoto" src="${recipeImage(r)}" alt="ภาพเครื่องดื่ม ${r.th}" /></div>
    <div>
      <a class="back" href="#/recipes"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>สูตรทั้งหมด</a>
      <div class="eyebrow" style="margin-top:6px">${CAT[r.cat]} · สูตรที่ ${r.id} จาก ${R.length}</div>
      <h1>${r.th}</h1>
      <div class="en">${r.en}</div>
      <div class="tags"><span class="tag">${r.time}</span><span class="tag">${r.level}</span><span class="tag">${r.temp === 'hot' ? 'ร้อน' : r.temp === 'blend' ? 'ปั่น' : r.temp === 'mixed' ? 'ร้อนและเย็น' : 'เย็น'}</span><span class="tag">${EQUIP[r.eq].label}</span>
        <button type="button" class="iconbtn fav" id="fav" aria-pressed="${favs.has(r.id)}" aria-label="บันทึกเป็นสูตรโปรด">${heart}</button></div>
    </div>
  </div></section>

  <div class="wrap"><div class="dbody">
    <div class="panel">
      <div class="inghead"><h2 style="margin:0">ส่วนผสม</h2>
        <div class="stepper" role="group" aria-label="จำนวน${r.unit}">
          <button type="button" id="dec" aria-label="ลดจำนวน">−</button><span id="cups" aria-live="polite">1 ${r.unit}</span><button type="button" class="plus" id="inc" aria-label="เพิ่มจำนวน">+</button>
        </div></div>
      <ul class="ing" id="ing"></ul>
      <h2>วิธีทำ</h2>
      <ol class="steps">${r.steps.map(s => `<li>${s}</li>`).join('')}</ol>
      ${r.timer ? `<div class="timer" id="timer"><div class="clock" id="clock" aria-live="polite">0</div><button type="button" class="btn" id="tbtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M10 2h4"/></svg>จับเวลา ${fmtT(r.timer)}</button></div>` : ''}
      ${r.tip ? `<p class="tip"><b>เคล็ดลับบาริสต้า</b> ${r.tip}</p>` : ''}
    </div>
    <aside class="panel"><div class="sticky">
      <h2>อุปกรณ์สำหรับสูตรนี้</h2>
      ${EQUIP[r.eq].prods.map(k => { const p = PRODUCTS[k]; return `<div class="prod"><span class="ico"><img class="symbol" src="assets/icons/${k === 'grinder' ? 'espresso' : k === 'drip' ? 'coffee' : k}.png" alt="" /></span><span style="flex-grow:1"><small>${p.type}</small><b>${p.name.startsWith("[") ? p.type : p.name}</b><span class="price">${p.url === "#" ? "โปรดตรวจสอบรุ่นสินค้าก่อนเลือกซื้อ" : p.price}</span></span></div>`; }).join('')}
      <div class="chips" style="margin-top:20px;justify-content:space-between">
        <a class="btn ghost" href="#/r/${prev.id}">‹ ${prev.th}</a><a class="btn ghost" href="#/r/${next.id}">${next.th} ›</a>
      </div>
    </div></aside>
  </div></div>`;
}

function shop() {
  return `
  <section class="pagehead"><div class="wrap">
    <span class="eyebrow">Shop</span><h1>เครื่องชงและเมล็ดกาแฟ</h1>
    <p>รายการอุปกรณ์ที่ใช้ในการเตรียมเครื่องดื่ม โปรดตรวจสอบรุ่นและสินค้าจริงที่ร้าน</p>
  </div></section>
  <section class="block" style="padding-top:12px"><div class="wrap"><div class="grid">
    ${Object.entries(PRODUCTS).map(([k, p]) => `<div class="prod" style="margin:0"><span class="ico"><img class="symbol" src="assets/icons/${k === 'grinder' ? 'espresso' : k === 'drip' ? 'coffee' : k}.png" alt="" /></span><span style="flex-grow:1"><small>${p.type} · ใช้ได้ ${R.filter(r => EQUIP[r.eq].prods.includes(k)).length} สูตร</small><b>${p.name.startsWith("[") ? p.type : p.name}</b><span class="price">${p.url === "#" ? "โปรดตรวจสอบรุ่นสินค้าก่อนเลือกซื้อ" : p.price}</span></span></div>`).join('')}
  </div></div></section>`;
}

/* ---------- helpers ---------- */
function fmtT(s) { return s >= 60 ? `${Math.floor(s / 60)} นาที ${String(s % 60).padStart(2, '0')} วินาที` : `${s} วินาที`; }
function fmtA(a) {
  if (a === null) return 'ตามชอบ';
  const n = Math.round(a * 10) / 10;
  if (n % 1 === 0.5 && n < 5) return (n >= 1 ? Math.floor(n) + ' ' : '') + '½';
  return n.toLocaleString('th-TH');
}

/* ---------- router ---------- */
const app = document.getElementById('app');
let tick = null;
function route() {
  clearInterval(tick);
  const [path, qs] = (location.hash.slice(1) || '/').split('?');
  const q = new URLSearchParams(qs || '');
  let nav = 'home';
  if (path.startsWith('/r/')) { nav = 'recipes'; app.innerHTML = detail(+path.slice(3)); bindDetail(+path.slice(3)); }
  else if (path === '/recipes') { nav = q.get('fav') === '1' ? 'fav' : 'recipes'; app.innerHTML = recipes(q); bindRecipes(q); }
  else if (path === '/shop') { nav = 'shop'; app.innerHTML = shop(); }
  else { app.innerHTML = home(); bindHome(); }
  document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === nav));
  window.scrollTo(0, 0);
}

function bindHome() {
  const note = () => {
    const n = R.filter(canMake).length;
    document.getElementById('eqnote').textContent = myEq.length ? `ด้วยเครื่องที่เลือก ทำได้ ${n} จาก ${R.length} สูตร` : 'ยังไม่ได้เลือก แสดงทุกสูตร';
  };
  document.querySelectorAll('[data-eq]').forEach(b => b.onclick = () => {
    const k = b.dataset.eq;
    myEq = myEq.includes(k) ? myEq.filter(x => x !== k) : [...myEq, k];
    store.set('myEq', myEq);
    b.setAttribute('aria-pressed', myEq.includes(k));
    note();
  });
  note();
}

function bindRecipes(q) {
  let cat = q.get('cat') || 'all';
  const fav = q.get('fav') === '1';
  const input = document.getElementById('q'), sel = document.getElementById('eqsel'), list = document.getElementById('list');
  if (q.get('focus')) input.focus();
  const base = () => R.filter(r => (!fav || favs.has(r.id)) && canMake(r));
  function update() {
    const t = input.value.trim().toLowerCase(), e = sel.value;
    const pool = base().filter(r => (!t || (r.th + r.en + r.spec).toLowerCase().includes(t)) && (!e || r.eq === e));
    document.querySelectorAll('[data-count]').forEach(s => {
      const k = s.dataset.count; s.textContent = k === 'all' ? pool.length : pool.filter(r => r.cat === k).length;
    });
    const shown = cat === 'all' ? pool : pool.filter(r => r.cat === cat);
    list.innerHTML = shown.length ? shown.map(card).join('')
      : `<div class="empty" style="grid-column:1/-1">${fav && !favs.size ? 'ยังไม่มีสูตรโปรด ลองกดหัวใจในหน้าสูตรดูนะ' : 'ไม่พบสูตรที่ตรงกับการค้นหา'}</div>`;
  }
  document.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => {
    cat = b.dataset.cat;
    document.querySelectorAll('[data-cat]').forEach(x => x.setAttribute('aria-pressed', x === b));
    update();
  });
  input.oninput = update; sel.onchange = update;
  if (myEq.length) {
    const p = document.createElement('p');
    p.style.cssText = 'color:var(--muted);font-size:14px;margin:12px 0 0';
    p.innerHTML = 'แสดงเฉพาะสูตรที่ทำได้กับเครื่องที่คุณเลือก · <a href="#/" >เปลี่ยน</a>';
    document.querySelector('.filters').appendChild(p);
  }
  update();
}

function bindDetail(id) {
  const r = R.find(x => x.id === id); if (!r) return;
  let n = 1;
  const draw = () => {
    document.getElementById('cups').textContent = `${n} ${r.unit}`;
    document.getElementById('ing').innerHTML = r.ing.map(([name, a, u]) => `<li><span>${name}</span><b>${fmtA(a === null ? null : a * n)} ${a === null ? '' : u}</b></li>`).join('');
  };
  document.getElementById('dec').onclick = () => { n = Math.max(1, n - 1); draw(); };
  document.getElementById('inc').onclick = () => { n = Math.min(10, n + 1); draw(); };
  draw();
  const fb = document.getElementById('fav');
  fb.onclick = () => {
    favs.has(id) ? favs.delete(id) : favs.add(id);
    store.set('favs', [...favs]);
    fb.setAttribute('aria-pressed', favs.has(id));
  };
  const tb = document.getElementById('tbtn');
  if (tb) tb.onclick = () => {
    clearInterval(tick);
    let left = r.timer;
    const box = document.getElementById('timer'), clock = document.getElementById('clock');
    box.classList.add('run'); clock.textContent = left;
    tb.lastChild.textContent = 'เริ่มใหม่';
    tick = setInterval(() => {
      left--;
      clock.textContent = left > 0 ? (left >= 60 ? `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}` : left) : 'เสร็จแล้ว!';
      if (left <= 0) { clearInterval(tick); try { navigator.vibrate && navigator.vibrate(200); } catch (e) {} }
    }, 1000);
  };
}

window.addEventListener('hashchange', route);
route();
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
</body>
</html>
